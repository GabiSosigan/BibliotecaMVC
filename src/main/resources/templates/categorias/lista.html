<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Categorias</title>
</head>
<body>

<h1>Total de categorias cadastradas: <span th:text="${categorias.size()}">0</span></h1>

<a th:href="@{/categorias/novo}">Cadastrar nova categoria</a>

<table>
  <tr>
    <th>Categoria</th>
    <th>Ações</th>
  </tr>
  <tr th:each="categoria : ${categorias}">
    <td th:text="${categoria.nome}">Nome da categoria</td>
    <td>
      <a th:href="@{/categorias/editar/{id}(id=${categoria.id})}">Editar</a> |
      <a th:href="@{/categorias/excluir/{id}(id=${categoria.id})}"
         onclick="return confirm('Tem certeza que deseja excluir esta categoria?')">Excluir</a>
    </td>
  </tr>
</table>

</body>
</html>
