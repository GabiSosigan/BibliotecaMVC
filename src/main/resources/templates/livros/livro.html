<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Livro</title>
</head>
<body>

    <h1>Informações</h1>
    <p th:text="${livro.titulo}" >Título</p>
    <p th:text="${livro.autor}">Autor</p>
    <p th:text="${livro.isbn}">ISBN</p>
    <p th:each="livro: ${livros}">Livros</p>

</body>
</html>
