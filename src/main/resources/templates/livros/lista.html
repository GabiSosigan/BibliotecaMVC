<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Prateleira</title>
</head>
<body>

<h1>Total de livros cadastrados: <span th:text="${livros.size()}">0</span></h1>

<a th:href="@{/livros/novo}">Cadastrar novo livro</a>

<table>
    <tr>
        <th>Título</th>
        <th>Autor</th>
        <th>ISBN</th>
        <th>Ações</th>
    </tr>
    <tr th:each="livro : ${livros}">
        <td th:text="${livro.titulo}">Título</td>
        <td th:text="${livro.autor}">Autor</td>
        <td th:text="${livro.isbn}">ISBN</td>
        <td>
            <a th:href="@{/livros/editar/{id}(id=${livro.id})}">Editar</a> |
            <a th:href="@{/livros/excluir/{id}(id=${livro.id})}"
               onclick="return confirm('Tem certeza que deseja excluir este livro?')">Excluir</a>
        </td>
    </tr>
</table>

</body>
</html>
