<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Prateleira</title>
</head>
<body>

<h1>Total de livros cadastrados: <span th:text="${livros.size()}">0</span></h1>

<table>
    <tr th:each="livro, status : ${livros}">
        <td th:text="${livro.titulo}">Título</td>
        <td th:text="${livro.autor}">Autor</td>
        <td th:text="${livro.isbn}">ISBN</td>
        <td>
            <a th:href="@{/livros/excluir/{id}(id=${livro.id})}">Excluir</a>
        </td>
    </tr>
</table>

</body>
</html>
